<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b141a">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #0b141a; color: #e9edef; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* WhatsApp Header */
        header { background: #202c33; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; height: 60px; border-bottom: 1px solid #222d34; }
        .chat-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #00a884; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; font-size: 1.1rem; }
        .name-status h2 { font-size: 1rem; font-weight: 500; color: #f1f1f2; }
        .name-status span { font-size: 0.75rem; color: #8696a0; }
        
        .header-icons { display: flex; gap: 22px; }
        .header-icons button { background: none; border: none; color: #aebac1; font-size: 1.25rem; cursor: pointer; }
        .header-icons button:hover { color: #00a884; }

        /* Sohbet Arka Planı (WhatsApp Duvar Kağıdı Deseni) */
        .chat-area { 
            flex: 1; 
            overflow-y: auto; 
            padding: 12px 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            background-color: #0b141a;
            background-image: radial-gradient(#111b21 1px, transparent 1px);
            background-size: 16px 16px;
        }

        /* Mesaj Baloncukları */
        .message { max-width: 80%; padding: 6px 10px 8px 12px; border-radius: 7.5px; position: relative; font-size: 0.93rem; line-height: 1.4; word-wrap: break-word; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); margin-bottom: 2px; }
        .message.incoming { background: #202c33; align-self: flex-start; border-top-left-radius: 0; color: #e9edef; }
        .message.outgoing { background: #005c4b; align-self: flex-end; border-top-right-radius: 0; color: #e9edef; }
        
        .message p { padding-right: 45px; } /* Tarih ve tikler için boşluk */
        .msg-meta { position: absolute; right: 8px; bottom: 4px; display: flex; align-items: center; gap: 3px; }
        .time { font-size: 0.65rem; color: #8696a0; }
        .ticks { font-size: 0.7rem; color: #53bdeb; font-weight: bold; } /* Mavi tik */
        
        .message img { width: 100%; border-radius: 6px; margin-top: 4px; max-height: 250px; object-fit: cover; display: block; }

        /* Alt Yazışma Çubuğu */
        .footer-bar { background: #202c33; padding: 8px 12px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #222d34; }
        .footer-icon { background: none; border: none; color: #8696a0; font-size: 1.3rem; cursor: pointer; padding: 6px; }
        .footer-icon:hover { color: #e9edef; }
        
        .input-wrapper { flex: 1; background: #2a3942; border-radius: 8px; display: flex; align-items: center; padding: 0 12px; }
        .input-wrapper input { flex: 1; background: none; border: none; padding: 10px 0; color: #e9edef; font-size: 0.95rem; outline: none; }
        .input-wrapper input::placeholder { color: #8696a0; }

        .send-btn { background: #00a884; color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; }
        .send-btn:hover { background: #01755c; }

        /* Görüntülü Arama Ekranı */
        .call-overlay { display: none; position: fixed; inset: 0; background: #0b141a; z-index: 999; flex-direction: column; justify-content: space-between; padding: 20px; }
        .video-box { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        video { width: 100%; max-height: 70vh; border-radius: 12px; object-fit: cover; background: #000; }
        #localVideo { width: 110px; height: 150px; position: absolute; bottom: 20px; right: 20px; border-radius: 8px; border: 2px solid #fff; }
        .call-actions { display: flex; justify-content: center; gap: 20px; padding-bottom: 20px; }
        .call-action-btn { width: 55px; height: 55px; border-radius: 50%; border: none; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; }
        .hangup { background: #ea0038; }
        .mute { background: #2a3942; }
    </style>
</head>
<body>

    <!-- WhatsApp Üst Bar -->
    <header>
        <div class="chat-info">
            <div class="avatar">F</div>
            <div class="name-status">
                <h2>Family</h2>
                <span>çevrimiçi</span>
            </div>
        </div>
        <div class="header-icons">
            <button onclick="startCall('audio')" title="Sesli Ara">📞</button>
            <button onclick="startCall('video')" title="Görüntülü Ara">📹</button>
        </div>
    </header>

    <!-- Sohbet Akışı -->
    <div class="chat-area" id="chatArea">
        <div class="message incoming">
            <p>Aile grubu kuruldu. WhatsApp renklerinde ve düzeninde birebir aktif edildi.</p>
            <div class="msg-meta">
                <span class="time">03:15</span>
            </div>
        </div>
    </div>

    <!-- Alt Mesaj Yazma Paneli -->
    <div class="footer-bar">
        <button class="footer-icon" onclick="document.getElementById('fileInput').click()" title="Fotoğraf Ekle">📎</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="sendImage(event)">
        
        <div class="input-wrapper">
            <input type="text" id="msgInput" placeholder="Mesaj" onkeypress="if(event.key==='Enter') sendMessage()">
        </div>
        
        <button class="footer-icon" id="micBtn" onclick="toggleVoiceNote()" title="Ses Kaydı">🎤</button>
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <!-- Arama Ekranı -->
    <div class="call-overlay" id="callScreen">
        <div style="text-align: center; padding-top: 15px;">
            <h3 id="callStatus" style="color: #00a884; font-weight: 500;">Görüşme Başlatılıyor...</h3>
        </div>
        <div class="video-box">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div class="call-actions">
            <button class="call-action-btn mute" onclick="toggleMute()">🎙️</button>
            <button class="call-action-btn hangup" onclick="endCall()">📞</button>
        </div>
    </div>

    <script>
        function getTime() {
            const d = new Date();
            return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const val = input.value.trim();
            if(!val) return;

            const area = document.getElementById('chatArea');
            area.innerHTML += `
                <div class="message outgoing">
                    <p>${val}</p>
                    <div class="msg-meta">
                        <span class="time">${getTime()}</span>
                        <span class="ticks">✓✓</span>
                    </div>
                </div>
            `;
            input.value = '';
            area.scrollTop = area.scrollHeight;
        }

        function sendImage(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const area = document.getElementById('chatArea');
                area.innerHTML += `
                    <div class="message outgoing">
                        <img src="${evt.target.result}" alt="Fotoğraf">
                        <div class="msg-meta" style="background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; bottom: 8px; right: 12px;">
                            <span class="time" style="color:#fff;">${getTime()}</span>
                            <span class="ticks">✓✓</span>
                        </div>
                    </div>
                `;
                area.scrollTop = area.scrollHeight;
            };
            reader.readAsDataURL(file);
        }

        let isRecording = false;
        function toggleVoiceNote() {
            isRecording = !isRecording;
            const btn = document.getElementById('micBtn');
            btn.style.color = isRecording ? '#ea0038' : '#8696a0';
            
            if(!isRecording) {
                const area = document.getElementById('chatArea');
                area.innerHTML += `
                    <div class="message outgoing">
                        <p>🎤 Sesli Mesaj (0:03)</p>
                        <div class="msg-meta">
                            <span class="time">${getTime()}</span>
                            <span class="ticks">✓✓</span>
                        </div>
                    </div>
                `;
                area.scrollTop = area.scrollHeight;
            } else {
                alert("🔴 Ses kaydediliyor... Bitirmek için tekrar mikrofona basın.");
            }
        }

        async function startCall(type) {
            document.getElementById('callScreen').style.display = 'flex';
            document.getElementById('callStatus').innerText = type === 'video' ? 'Görüntülü Araniyor...' : 'Sesli Araniyor...';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: type === 'video', audio: true });
                document.getElementById('localVideo').srcObject = stream;
            } catch(err) {
                alert("Kamera/Mikrofon izni alınamadı: " + err.message);
                endCall();
            }
        }

        function endCall() {
            document.getElementById('callScreen').style.display = 'none';
            const vid = document.getElementById('localVideo');
            if(vid.srcObject) {
                vid.srcObject.getTracks().forEach(t => t.stop());
            }
        }

        function toggleMute() {
            const vid = document.getElementById('localVideo');
            if(vid.srcObject) {
                const track = vid.srcObject.getAudioTracks()[0];
                if(track) track.enabled = !track.enabled;
                alert(track.enabled ? "Mikrofon Açık" : "Mikrofon Kapalı");
            }
        }
    </script>
</body>
</html>
